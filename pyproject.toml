[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper-ai"
version = "0.1.0"
description = "Convierte videos largos en clips cortos verticales con IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10,<3",
    "faster-whisper>=1.2.1,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2.4,<2",
]

[project.scripts]
clipper = "clipper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
